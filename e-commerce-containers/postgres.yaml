services:
  postgres:
    image: postgres:16-alpine
    container_name: e-commerce-postgres
    environment:
      POSTGRES_USER: e-commerce
      POSTGRES_PASSWORD: Mile123_A
      POSTGRES_DB: e-commerce_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
