services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog_test
      POSTGRES_PASSWORD: catalog_test
      POSTGRES_DB: ecommerce_catalog_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U catalog_test -d ecommerce_catalog_test']
      interval: 2s
      timeout: 3s
      retries: 20
